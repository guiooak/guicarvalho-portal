<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confira seu e-mail · gui carvalho</title>
  <meta name="description" content="Confirme sua inscrição na newsletter.">
  <link rel="icon" href="../../assets/images/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/stylesheets/application.css">
  <link rel="stylesheet" href="../../assets/stylesheets/mockup.css">
  <script src="../../assets/javascripts/mockup.js?v=2026-10-19f"></script>
</head>
<body class="paper">
  <div class="site">
    <site-header root="../../" alternate="../../en/newsletter/check-your-inbox.html"></site-header>

    <main id="main" class="container">
      <section class="center-stage">
        <span class="sticker center-stage__sticker" style="--r:-8deg"><svg aria-hidden="true"><use href="#obj-envelope"/></svg></span>
        <div class="sticky-note center-stage__card" style="--r:-1deg">
          <h1>Quase lá! Confira seu e-mail</h1>
          <p>Mandei um e-mail para <strong>seu@email.com</strong> com um link de confirmação. É só clicar nele para começar a receber os posts.</p>
          <p class="center-stage__fine">Não chegou em alguns minutos? Dá uma olhada na caixa de spam ou de promoções.</p>
          <div class="cluster center-stage__actions">
            <button class="button" type="button">Reenviar o e-mail</button>
            <a class="button button--secondary" href="../blog.html">Voltar ao blog</a>
          </div>
        </div>
      </section>

    </main>

    <site-footer root="../../"></site-footer>
  </div>

  <div class="mockup-toolbar" aria-label="Ferramentas do mockup">
    <button type="button" data-notes-toggle>Notas do mockup</button>
  </div>
</body>
</html>
