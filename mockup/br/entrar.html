<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · gui carvalho</title>
  <meta name="description" content="Entre com sua conta Google para comentar.">
  <link rel="icon" href="../assets/images/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/stylesheets/application.css?v=2026-10-23a">
  <link rel="stylesheet" href="../assets/stylesheets/mockup.css?v=2026-10-23a">
  <script src="../assets/javascripts/mockup.js?v=2026-10-23c"></script>
</head>
<body class="paper">
  <div class="site">
    <site-header root="../" alternate="../en/sign-in.html"></site-header>

    <main id="main" class="container">
      <section class="center-stage">
        <span class="sticker center-stage__sticker" style="--r:-8deg"><svg aria-hidden="true"><use href="#obj-chat"/></svg></span>
        <div class="sheet center-stage__card" style="--r:-1deg">
          <h1>Entre para comentar</h1>
          <p class="text-muted">Use sua conta Google para comentar nos posts e acompanhar as respostas.</p>
          <a class="button button--google" href="#"><svg aria-hidden="true"><use href="#icon-google"/></svg>Entrar com Google</a>
          <p class="center-stage__fine">Usamos só seu nome e sua foto do Google. Nunca publicamos seu e-mail.</p>
        </div>
      </section>
      <div class="cluster" style="justify-content: center; margin-block-end: var(--space-2xl)">
        <div class="sticky-note" style="--r:3deg; max-width: 20rem"><span class="sticky-note__title">Por que só Google?</span>Menos uma senha para lembrar, e bem menos spam nos comentários.</div>
      </div>
    </main>

    <site-footer root="../"></site-footer>
  </div>

  <div class="mockup-toolbar" aria-label="Ferramentas do mockup">
    <button type="button" data-notes-toggle>Notas do mockup</button>
  </div>
</body>
</html>
