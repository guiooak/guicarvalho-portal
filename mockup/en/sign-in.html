<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · gui carvalho</title>
  <meta name="description" content="Sign in with your Google account to comment.">
  <link rel="icon" href="../assets/images/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/stylesheets/application.css">
  <link rel="stylesheet" href="../assets/stylesheets/mockup.css">
  <script src="../assets/javascripts/mockup.js?v=2026-10-19b"></script>
</head>
<body class="paper">
  <div class="site">
    <site-header root="../" alternate="../br/entrar.html"></site-header>

    <main id="main" class="container">
      <section class="center-stage">
        <span class="sticker center-stage__sticker" style="--r:-8deg"><svg aria-hidden="true"><use href="#obj-chat"/></svg></span>
        <div class="sheet center-stage__card" style="--r:-1deg">
          <h1>Sign in to comment</h1>
          <p class="text-muted">Use your Google account to comment on posts and follow the replies.</p>
          <a class="button button--google" href="#"><svg aria-hidden="true"><use href="#icon-google"/></svg>Sign in with Google</a>
          <p class="center-stage__fine">We only use your Google name and photo. We never publish your email.</p>
        </div>
      </section>
      <div class="cluster" style="justify-content: center; margin-block-end: var(--space-2xl)">
        <div class="sticky-note" style="--r:3deg; max-width: 20rem"><span class="sticky-note__title">Why only Google?</span>One less password to remember, and far less spam in the comments.</div>
      </div>
    </main>

    <site-footer root="../"></site-footer>
  </div>

  <div class="mockup-toolbar" aria-label="Mockup tools">
    <button type="button" data-notes-toggle>Mockup notes</button>
  </div>
</body>
</html>
