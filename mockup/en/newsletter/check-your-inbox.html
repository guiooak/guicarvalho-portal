<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your inbox · gui carvalho</title>
  <meta name="description" content="Confirm your newsletter subscription.">
  <link rel="icon" href="../../assets/images/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/stylesheets/application.css">
  <link rel="stylesheet" href="../../assets/stylesheets/mockup.css">
  <script src="../../assets/javascripts/mockup.js?v=2026-10-19"></script>
</head>
<body class="paper">
  <div class="site">
    <site-header root="../../" alternate="../../br/newsletter/confirme.html"></site-header>

    <main id="main" class="container">
      <section class="center-stage">
        <span class="sticker center-stage__sticker" style="--r:-8deg"><svg aria-hidden="true"><use href="#obj-envelope"/></svg></span>
        <div class="sticky-note center-stage__card" style="--r:-1deg">
          <h1>Almost there! Check your inbox</h1>
          <p>I sent an email to <strong>you@email.com</strong> with a confirmation link. Just click it to start getting new posts.</p>
          <p class="center-stage__fine">Nothing after a few minutes? Take a look at your spam or promotions folder.</p>
          <div class="cluster center-stage__actions">
            <button class="button" type="button">Resend the email</button>
            <a class="button button--secondary" href="../blog.html">Back to the blog</a>
          </div>
        </div>
      </section>

    </main>

    <site-footer root="../../"></site-footer>
  </div>

  <div class="mockup-toolbar" aria-label="Mockup tools">
    <button type="button" data-notes-toggle>Mockup notes</button>
  </div>
</body>
</html>
